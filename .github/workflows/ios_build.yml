name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build iOS IPA (iPhone 16 Pro / iOS 16+)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project ios/YouTubeDownload.xcodeproj \
            -scheme YouTubeDownload \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/YouTubeDownload.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .IPA
        run: |
          mkdir -p Payload
          cp -r build/YouTubeDownload.xcarchive/Products/Applications/YouTubeDownload.app Payload/
          zip -r -q YouTubeDownload.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownload-iOS-IPA
          path: YouTubeDownload.ipa
          if-no-files-found: error
